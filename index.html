<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฏิทินการประเมิน PA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: sans-serif; color: #666; background: #fff;
  }
  iframe {
    width: 100%; height: 100vh; border: none; display: block;
  }
  #fallback {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: sans-serif; text-align: center; padding: 24px;
  }
  #fallback a {
    margin-top: 16px; padding: 10px 20px; background: #1a73e8; color: #fff;
    text-decoration: none; border-radius: 6px;
  }
</style>
</head>
<body>

  <div id="loading">กำลังโหลด...</div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzqX1xrmbCS2a_x3WUEXIsm0wk11urQpxbC6DzKfEF7tABet8UwL9w9k6tBj-HEQugchg/exec"
    onload="document.getElementById('loading').style.display='none';"
  ></iframe>

  <div id="fallback">
    <p>ไม่สามารถแสดงหน้าเว็บภายในหน้านี้ได้ (ถูกบล็อกโดย Google)</p>
    <a href="https://script.google.com/macros/s/AKfycbzqX1xrmbCS2a_x3WUEXIsm0wk11urQpxbC6DzKfEF7tABet8UwL9w9k6tBj-HEQugchg/exec" target="_blank" rel="noopener">
      เปิดหน้าเว็บในแท็บใหม่
    </a>
  </div>

  <script>
    // ถ้า Google Apps Script ปฏิเสธการฝังใน iframe (X-Frame-Options)
    // เบราว์เซอร์จะไม่ยิง error event ที่จับได้ตรงๆ จึงใช้การตรวจสอบด้วย timeout
    var frame = document.getElementById('appFrame');
    var loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;
    });

    setTimeout(function () {
      try {
        // ถ้าเข้าถึง contentWindow ไม่ได้ หรือยังไม่โหลด ให้ลองเช็คว่าว่างเปล่าไหม
        if (!loaded) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('fallback').style.display = 'flex';
          frame.style.display = 'none';
        }
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
        frame.style.display = 'none';
      }
    }, 4000);
  </script>

</body>
</html>
